name: Bug report
description: Report a problem with team-freeze-guard
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include your action.yml configuration if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Action version
      description: The version/tag of team-freeze-guard you are using.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant workflow run logs or a link to the run.
      render: shell
