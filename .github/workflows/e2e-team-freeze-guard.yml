name: Team freeze guard (e2e)

# Dogfood check: runs automatically on every PR here
#
# 1. no frozen team -> PASS
# 2. a random frozen team -> PASS
# 3. apm-reliability-and-performance (repo owner, so very likely a contributing team) is frozen team, but bypass label is present -> PASS
#
# Uses `pull_request`, not `_target`, unlike the production consumer workflow —
# this tests THIS repo's own action code, so it needs the PR's own dist/, same
# trust model as ci.yml. Only safe while PRs come from same-repo branches, not forks.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  team-freeze-guard-e2e:
    name: Team freeze guard (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No frozen teams
        uses: ./
        with:
          bypass-labels: ""
          frozen-teams: ""
      - name: Ramdom frozen teams
        uses: ./
        with:
          bypass-labels: not-a-real-label
          frozen-teams: |
            @DataDog/paintfooding
      - name: Real contributor team
        uses: ./
        with:
          bypass-labels: |
            team-freeze-guard
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
