name: Team freeze guard (e2e)

# Dogfood check, run manually against a PR branch `e2e-tests`
#
# 1. no frozen team -> PASS
# 2. a random frozen team -> PASS
# 3. apm-reliability-and-performance (repo owner, so very likely a contributing team) is frozen team, but bypass label is present -> PASS
#
# Uses `pull_request_target` (required for octo-sts's trust policy) with a
# checkout so `uses: ./` has something to resolve against — with no `ref:`
# override, that checkout pulls `main`, so this always tests main's already-
# merged action code, not this PR's own diff.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  id-token: write
  contents: read

jobs:
  team-freeze-guard-e2e:
    name: Team freeze guard (e2e)
    runs-on: ubuntu-latest
    if: github.head_ref == 'e2e-tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No frozen teams
        uses: ./
        with:
          bypass-labels: ""
          frozen-teams: ""
      - name: Ramdom frozen teams
        uses: ./
        with:
          bypass-labels: not-a-real-label
          frozen-teams: |
            @DataDog/paintfooding
      - name: Real contributor team
        uses: ./
        with:
          bypass-labels: |
            team-freeze-guard
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
      - name: Real contributor team, and it should fail
        id: should-fail
        continue-on-error: true
        uses: ./
        with:
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
          frozen-message: |
            This test is expected to fail
            If you're seing this message, it means all good!

      - name: Check that the previous step failed as expected
        if: steps.should-fail.outcome != 'failure'
        run: |
          echo "Expected 'Real contributor team, and it should fail' to fail, but it did not (outcome: ${{ steps.should-fail.outcome }})."
          exit 1
