name: Team freeze guard (e2e)

# Dogfood check, run manually against a PR branch `e2e-tests`
#
# 1. no frozen team -> PASS
# 2. a random frozen team -> PASS
#
# apm-reliability-and-performance (repo owner, so very likely a contributing
# team) is used as the frozen team for every scenario below, combining the two
# bypass mechanisms (bypass-labels, bypass-title-pattern):
#
# 3. bypass label only, present            -> PASS
# 4. bypass label only, absent             -> FAIL
# 5. bypass title pattern only, matching   -> PASS
# 6. bypass title pattern only, mismatched -> FAIL
# 7. both configured, both satisfied       -> PASS
# 8. both configured, only one satisfied   -> FAIL
# 9. neither configured                    -> FAIL
#
# The `team-freeze-guard` label is expected to already be applied to the
# `e2e-tests` PR; ".*" always matches the real PR title, while the
# "^this-will-never-match-a-real-pr-title$" pattern is chosen to never match it.
#
# Uses `pull_request_target` (required for octo-sts's trust policy) with a
# checkout so `uses: ./` has something to resolve against — with no `ref:`
# override, that checkout pulls `main`, so this always tests main's already-
# merged action code, not this PR's own diff.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - edited

permissions:
  id-token: write
  contents: read

jobs:
  team-freeze-guard-e2e:
    name: Team freeze guard (e2e)
    runs-on: ubuntu-latest
    if: github.head_ref == 'e2e-tests'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No frozen teams
        uses: ./
        with:
          bypass-labels: ""
          frozen-teams: ""
      - name: Ramdom frozen teams
        uses: ./
        with:
          bypass-labels: not-a-real-label
          frozen-teams: |
            @DataDog/paintfooding

      # --- Frozen team, bypass label only ---

      - name: Frozen team, bypass label present -> pass
        uses: ./
        with:
          bypass-labels: |
            team-freeze-guard
          frozen-teams: |
            @DataDog/apm-reliability-and-performance

      - name: Frozen team, bypass label absent -> fail
        id: should-fail-label-absent
        continue-on-error: true
        uses: ./
        with:
          bypass-labels: not-a-real-label
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
          frozen-message: |
            This test is expected to fail (no bypass label present)
            If you're seing this message, it means all good!
      - name: Check that "bypass label absent" failed as expected
        if: steps.should-fail-label-absent.outcome != 'failure'
        run: |
          echo "Expected 'Frozen team, bypass label absent -> fail' to fail, but it did not (outcome: ${{ steps.should-fail-label-absent.outcome }})."
          exit 1

      # --- Frozen team, bypass title pattern only ---

      - name: Frozen team, PR title matches bypass pattern -> pass
        uses: ./
        with:
          bypass-title-pattern: ".*"
          frozen-teams: |
            @DataDog/apm-reliability-and-performance

      - name: Frozen team, PR title does not match bypass pattern -> fail
        id: should-fail-title-mismatch
        continue-on-error: true
        uses: ./
        with:
          bypass-title-pattern: "^this-will-never-match-a-real-pr-title$"
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
          frozen-message: |
            This test is expected to fail (PR title does not match the bypass pattern)
            If you're seing this message, it means all good!
      - name: Check that "PR title does not match bypass pattern" failed as expected
        if: steps.should-fail-title-mismatch.outcome != 'failure'
        run: |
          echo "Expected 'Frozen team, PR title does not match bypass pattern -> fail' to fail, but it did not (outcome: ${{ steps.should-fail-title-mismatch.outcome }})."
          exit 1

      # --- Frozen team, both bypass mechanisms configured ---

      - name: Frozen team, bypass label present and title matches -> pass
        uses: ./
        with:
          bypass-labels: |
            team-freeze-guard
          bypass-title-pattern: ".*"
          frozen-teams: |
            @DataDog/apm-reliability-and-performance

      - name: Frozen team, bypass label present but title does not match -> fail
        id: should-fail-only-one-satisfied
        continue-on-error: true
        uses: ./
        with:
          bypass-labels: |
            team-freeze-guard
          bypass-title-pattern: "^this-will-never-match-a-real-pr-title$"
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
          frozen-message: |
            This test is expected to fail (only one of the two configured bypass conditions is satisfied)
            If you're seing this message, it means all good!
      - name: Check that "only one of two configured bypass conditions satisfied" failed as expected
        if: steps.should-fail-only-one-satisfied.outcome != 'failure'
        run: |
          echo "Expected 'Frozen team, bypass label present but title does not match -> fail' to fail, but it did not (outcome: ${{ steps.should-fail-only-one-satisfied.outcome }})."
          exit 1

      # --- Frozen team, no bypass mechanism configured ---

      - name: Frozen team, no bypass mechanism configured -> fail
        id: should-fail-no-bypass
        continue-on-error: true
        uses: ./
        with:
          frozen-teams: |
            @DataDog/apm-reliability-and-performance
          frozen-message: |
            This test is expected to fail (no bypass mechanism configured)
            If you're seing this message, it means all good!
      - name: Check that "no bypass mechanism configured" failed as expected
        if: steps.should-fail-no-bypass.outcome != 'failure'
        run: |
          echo "Expected 'Frozen team, no bypass mechanism configured -> fail' to fail, but it did not (outcome: ${{ steps.should-fail-no-bypass.outcome }})."
          exit 1
