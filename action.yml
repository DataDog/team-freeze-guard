name: 'Team freeze guard'
description: 'Blocks pull requests from frozen GitHub teams unless a configured bypass label is present.'

inputs:
  bypass-labels:
    description: 'Newline-delimited list of labels. Any one present on the pull request satisfies the check when a participant belongs to a frozen team.'
    required: true
    default: ''
  frozen-teams:
    description: 'Newline-delimited list of frozen GitHub team slugs (e.g. @org/team-slug). An empty list disables the freeze.'
    required: true
    # Intentionally invalid: a caller that forgets to pass this
    # input must fail closed (ConfigError), not be silently treated the same
    # as a caller who explicitly disables the freeze with frozen-teams: ''.
    default: '__frozen-teams-not-set__'

runs:
  using: 'composite'
  steps:
    # Either frozen-teams is empty-like, or a bypass label is already on the PR: both make
    # the outcome a foregone pass, so skip the Octo STS exchange and every API call below
    # rather than just skipping the final decision. The bypass-label half of this check is
    # a duplicate, API-cost-driven fast path for the authoritative one in decide()/src/decision.ts
    # (case-sensitive set membership, same as there) — this step being wrong only ever costs
    # an extra API round-trip, never a wrong pass/fail, since decide() still re-checks it.
    - name: Early checks (skip when the freeze is disabled or a bypass label is already present)
      id: early-checks
      shell: python
      env:
        FROZEN_TEAMS: ${{ inputs.frozen-teams }}
        BYPASS_LABELS: ${{ inputs.bypass-labels }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
      run: |
        import os

        def nonempty_lines(raw):
            return {line.strip() for line in raw.splitlines() if line.strip()}

        frozen_teams = nonempty_lines(os.environ["FROZEN_TEAMS"])
        bypass_labels = nonempty_lines(os.environ["BYPASS_LABELS"])
        pr_labels = nonempty_lines(os.environ["PR_LABELS"])

        skip = not frozen_teams or bool(bypass_labels & pr_labels)

        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"skip={'true' if skip else 'false'}\n")

    # Trust policy: DataDog/.github/.github/chainguard/team-freeze-guard.read-org-members.sts.yaml
    # (see docs/Internals/octo-sts.md). The org scope and policy are intentionally
    # not exposed as repository inputs (see README's "Required workflow permissions"
    # section), so this is hardcoded here rather than configurable per caller.
    - name: Exchange OIDC identity for an org-scoped GitHub token
      id: octo-sts
      if: steps.early-checks.outputs.skip != 'true'
      uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
      with:
        scope: DataDog
        policy: team-freeze-guard.read-org-members

    # Split out from "Evaluate team freeze policy" so its result (one API call per frozen
    # team) can be cached across pipeline runs in a follow-up PR, without also caching the
    # participant-vs-membership decision below.
    - name: Resolve frozen team membership
      id: resolve-team-membership
      if: steps.early-checks.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/resolve-team-membership/index.js"
      env:
        ORG_TOKEN: ${{ steps.octo-sts.outputs.token }}
        # @actions/core's getInput() only replaces spaces (not dashes) before
        # uppercasing an input name to its INPUT_ env var, so these must keep
        # the dash rather than using an underscore.
        INPUT_BYPASS-LABELS: ${{ inputs.bypass-labels }}
        INPUT_FROZEN-TEAMS: ${{ inputs.frozen-teams }}

    - name: Evaluate team freeze policy
      if: steps.early-checks.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TEAM_MEMBERSHIP: ${{ steps.resolve-team-membership.outputs.team-membership }}
        INPUT_BYPASS-LABELS: ${{ inputs.bypass-labels }}
        INPUT_FROZEN-TEAMS: ${{ inputs.frozen-teams }}
