name: 'Team freeze guard'
description: 'Blocks pull requests from frozen GitHub teams unless a configured bypass label is present.'

inputs:
  bypass-labels:
    description: 'Newline-delimited list of labels. Any one present on the pull request satisfies the check when a participant belongs to a frozen team.'
    required: true
    default: ''
  frozen-teams:
    description: 'Newline-delimited list of frozen GitHub team slugs (e.g. @org/team-slug). An empty list disables the freeze.'
    required: true
    # Intentionally invalid rather than '': a caller that forgets to pass this
    # input must fail closed (ConfigError), not be silently treated the same
    # as a caller who explicitly disables the freeze with frozen-teams: ''.
    default: '__frozen-teams-not-set__'

runs:
  using: 'composite'
  steps:
    # Both cases below make the outcome a foregone pass without needing any external call, so
    # this step decides up front whether to skip the rest of the action entirely:
    #   - frozen-teams is empty once blank lines are stripped. inputs.frozen-teams != '' alone
    #     isn't enough here, since a whitespace-only or newline-only value (e.g. "\n \n") is also
    #     "no frozen teams" as far as dist/index.js's own parsing is concerned, but isn't the
    #     literal '' string. The "not set" sentinel default above is deliberately NOT treated as
    #     empty here — an omitted input must still reach dist/index.js and fail closed.
    #   - a configured bypass label is already present on the pull request. Pull request labels
    #     are already in the webhook payload (github.event.pull_request.labels), so this needs no
    #     API call either.
    #
    # Trade-off: this also means a malformed frozen-teams value is never caught (dist/index.js's
    # ConfigError check never runs) when a bypass label happens to be present. Bypass labels are an
    # explicit, human-applied override, so skipping evaluation entirely once one is present is
    # consistent with that intent — but it does mean config validation only happens on pull requests
    # without a bypass label.
    - name: Early checks (skip when the freeze is disabled or already bypassed)
      id: early-checks
      shell: python
      env:
        BYPASS_LABELS: ${{ inputs.bypass-labels }}
        FROZEN_TEAMS: ${{ inputs.frozen-teams }}
      run: |
        import json
        import os

        frozen_teams_empty = not any(line.strip() for line in os.environ["FROZEN_TEAMS"].splitlines())

        with open(os.environ["GITHUB_EVENT_PATH"]) as f:
            event = json.load(f)
        pr_labels = {label["name"] for label in (event.get("pull_request") or {}).get("labels", [])}
        bypass_labels = {line.strip() for line in os.environ["BYPASS_LABELS"].splitlines() if line.strip()}
        bypassed = not pr_labels.isdisjoint(bypass_labels)

        skip = frozen_teams_empty or bypassed
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"skip={'true' if skip else 'false'}\n")

    # TODO: fill in the real scope/policy, per docs/Internals/octo-sts.md, once
    # the trust policy for this action is published in DataDog's canonical
    # Octo STS policy location. The org scope and policy are intentionally not
    # exposed as repository inputs (see README's "Required workflow permissions"
    # section), so this is hardcoded here rather than configurable per caller.
    - name: Exchange OIDC identity for an org-scoped GitHub token
      id: octo-sts
      if: steps.early-checks.outputs.skip != 'true'
      uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
      with:
        scope: REPLACE_WITH_ORG/REPLACE_WITH_POLICY

    - name: Evaluate team freeze policy
      if: steps.early-checks.outputs.skip != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ORG_TOKEN: ${{ steps.octo-sts.outputs.token }}
        # @actions/core's getInput() only replaces spaces (not dashes) before
        # uppercasing an input name to its INPUT_ env var, so these must keep
        # the dash rather than using an underscore.
        INPUT_BYPASS-LABELS: ${{ inputs.bypass-labels }}
        INPUT_FROZEN-TEAMS: ${{ inputs.frozen-teams }}
